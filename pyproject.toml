[project]
name = "radar-repos"
version = "0.1.0"
description = "Agente que monitorea repos top y en tendencia de GitHub y redes sociales, los categoriza y explica su uso."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.1.0",
    "ctranslate2>=4.8.3",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "sentencepiece>=0.2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[project.scripts]
radar-healthcheck = "radar.healthcheck:main"
radar-ranking = "radar.ranking:main"
radar-tendencia = "radar.tendencia:main"
radar-hackernews = "radar.hackernews:main"
radar-reddit = "radar.reddit:main"
radar-bluesky = "radar.bluesky:main"
radar-panel = "radar.panel:main"
radar-traducir = "radar.traductor:main"
radar-diario = "radar.diario:main"
radar-salud = "radar.salud:main"
radar-ia = "radar.ia:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
